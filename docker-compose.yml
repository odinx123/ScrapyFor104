services:
  mysql:
    image: mysql:8.0
    container_name: scrapy104-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${SCRAPY104_DB_PASSWORD:-9879}
      TZ: Asia/Taipei
    ports:
      - "${SCRAPY104_DB_PORT:-3306}:3306"
    volumes:
      - scrapy104-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: scrapy104-redis
    ports:
      - "${SCRAPY104_REDIS_PORT:-6379}:6379"
    volumes:
      - scrapy104-redis-data:/data

volumes:
  scrapy104-mysql-data:
  scrapy104-redis-data:
